name: Profile visuals

on:
  schedule:
    - cron: "0 18 * * *" # daily, 00:00 in Dhaka
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/architecture.mmd"
      - ".github/profile-3d-settings.json"
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D graph and architecture diagram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render the 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Render the architecture diagram
        run: |
          mkdir -p profile-3d-contrib
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          echo '{"htmlLabels":false,"flowchart":{"htmlLabels":false}}' > "$RUNNER_TEMP/mermaid.json"
          npx -y -p @mermaid-js/mermaid-cli@11.12.0 mmdc \
            -p "$RUNNER_TEMP/puppeteer.json" -c "$RUNNER_TEMP/mermaid.json" \
            -i .github/architecture.mmd -o profile-3d-contrib/architecture.svg -b transparent

      - name: Publish the images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
